#Update all the sections by editing the data.yml file inside _data folder.

# Site Settings
title: Dannie Soskel
url: 'http://danniesoskel.dev'
baseurl: '/' #change it according to your repository name
description: Mid-level software engineer with 8 years of experience in process automation and improvement, workflow efficiency, and data processing. Recognized for exceeding goals by automating and standardizing existing tooling. Consistently striving to identify ways in which we can work smarter, not harder.
# Style will be applied only after restarting the build or serve. Just choose one of the options.
theme_skin: lavender # blue turquoise green berry orange ceramic lavender
chrome_mobile_color: #use hex colors (ex:#1976d2) or leave empty if you don't want a color for chrome mobile search bar

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed # http://sass-lang.com/documentation/file.SASS_REFERENCE.html#output_style

# Build settings
compress-site: yes

encoding: "utf-8"
compress_html: # - http://jch.penibelst.de/
  clippings: all
  ignore:
    envs: development

# Development Settings
port: 4000
host: 0.0.0.0
safe: false
