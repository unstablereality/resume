career-profile:
    title: Career Profile
    summary: |
      Analytical and tech-savvy professional with established experience in solution design, project management, and data/software engineering. Proven history of success in managing the full life cycle of software development processes. Adept at directing technical projects from start to end, preparing and executing strategic plans and control structures for projects, and ensuring successful completion within time and budget. 
      
      Expertise includes:

      Software Development Life Cycle (SDLC) / Engineering System Integration / ETL Processes Data Processing & Modeling / Software Design / Software & Web Maintenance / Relationship Building / Quality Assurance & Testing / Troubleshooting & Issue Resolution / Continuous Process Improvement

